[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "Credit card fraud detection: model comparison + Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.46.0",
    "streamlit>=1.62.0",
    "torch>=2.13.0",
    "xgboost>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv]
package = false